name: Unit Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: JUnit 5 tests (CalculatorTest)
        run: mvn -B test

      - name: TestNG tests (CalculatorTestNGTest)
        if: always()
        run: mvn -B test -Ptestng
